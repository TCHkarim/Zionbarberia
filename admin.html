<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Panel · Zion Barbería</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.adm{max-width:900px;margin:0 auto;padding:2rem 1rem 4rem;display:grid;gap:1.2rem}.adm h1{font-size:1.8rem}.adm img{width:70px;border-radius:50%}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end}.bar label{display:grid;gap:.3rem;font-size:.8rem;color:var(--gold)}
.adm input,.adm select,.adm textarea{background:#000;border:1px solid var(--line);color:var(--cream);padding:.6rem;border-radius:3px;font:inherit;color-scheme:dark}
.adm button{background:none;border:1px solid var(--line);color:var(--gold-l);padding:.5rem 1rem;border-radius:999px;cursor:pointer;font:inherit}.adm button:hover{background:var(--gold);color:#000}.adm .danger{border-color:#a33;color:#e88}
.ap{padding:1rem;border:1px solid var(--line);background:var(--panel);display:grid;gap:.4rem}.ap b{color:var(--gold-l);font-weight:500}.ap .act{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.st{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.st.cancelado{color:#e88}.st.confirmado{color:#8d8}
textarea{width:100%;font-family:monospace;font-size:.85rem}</style></head>
<body><main class="adm">
<img src="assets/logo.png" alt=""><h1>Panel de turnos</h1>
<form id="login" class="bar"><label>Correo<input type="email" id="em" required></label><label>Contraseña<input type="password" id="pw" required></label><button>Entrar</button><span id="err"></span></form>
<section id="app" hidden style="display:grid;gap:1.2rem">
 <div class="bar"><label>Estado<select id="fSt"><option value="">Todos</option><option>pendiente</option><option>confirmado</option><option>cancelado</option></select></label><label>Desde<input type="date" id="fFrom"></label><button id="reload">Actualizar</button><button id="reset" class="danger">Resetear todos los turnos</button><button id="out">Salir</button></div>
 <div id="list"></div>
 <details><summary>Servicios, horarios y promo</summary>
  <p style="color:var(--muted)">Servicios: lista con id, name, desc, min, price (0 = "Consultar"). Horarios: 0=domingo … 6=sábado, sin entrada = cerrado. Días cerrados: fechas "AAAA-MM-DD".</p>
  <label class="field">Servicios (JSON)<textarea id="tSv" rows="9"></textarea></label>
  <label class="field">Horarios (JSON)<textarea id="tSc" rows="5"></textarea></label>
  <label class="field">Días cerrados (JSON)<textarea id="tCl" rows="2">[]</textarea></label>
  <label class="field">Promo<input id="tPr"></label>
  <button id="save" style="margin-top:.8rem">Guardar cambios</button></details>
</section>
<script src="config.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,query,orderBy,getDocs,doc,getDoc,setDoc,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const C=window.ZION,$=s=>document.querySelector(s),app=initializeApp(C.firebase),auth=getAuth(app),db=getFirestore(app);
let rows=[];
$("#login").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}catch(x){$("#err").textContent="Datos incorrectos"}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("#login").hidden=!!u;$("#app").hidden=!u;if(u){load();settings()}});
const wp=p=>{p=p.replace(/\D/g,"").replace(/^0/,"");return p.startsWith("54")?p:"549"+p};
async function load(){rows=(await getDocs(query(collection(db,"appointments"),orderBy("createdAt","desc")))).docs.map(d=>({id:d.id,...d.data()}));draw()}
function draw(){const s=$("#fSt").value,f=$("#fFrom").value,r=rows.filter(a=>(!s||a.status===s)&&(!f||a.date>=f));
 $("#list").innerHTML=r.length?r.map(a=>`<article class="ap"><span class="st ${a.status}">${a.status}</span><b>${a.date.split("-").reverse().join("/")} · ${a.time} · ${a.serviceName}</b><span>${a.name} · ${a.phone} · ${a.email}</span>${a.notes?`<em>${a.notes.replace(/</g,"&lt;")}</em>`:""}<div class="act"><a class="text-link" target="_blank" href="https://wa.me/${wp(a.phone)}">WhatsApp</a>${a.status==="pendiente"?`<button data-a="ok" data-id="${a.id}">Confirmar</button>`:""}${a.status!=="cancelado"?`<button data-a="no" data-id="${a.id}">Cancelar y liberar horario</button>`:""}<button class="danger" data-a="del" data-id="${a.id}">Eliminar</button></div></article>`).join(""):"<p>No hay turnos.</p>"}
$("#list").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const a=rows.find(x=>x.id===b.dataset.id),w=writeBatch(db),ar=doc(db,"appointments",a.id);
 if(b.dataset.a==="ok")w.update(ar,{status:"confirmado"});
 else{if(b.dataset.a==="del"&&!confirm("¿Eliminar este turno?"))return;(a.slots||[]).forEach(s=>w.delete(doc(db,"slots",s)));b.dataset.a==="del"?w.delete(ar):w.update(ar,{status:"cancelado"})}
 await w.commit();load()};
$("#fSt").onchange=$("#fFrom").onchange=draw;$("#reload").onclick=load;
$("#reset").onclick=async()=>{if(!confirm("Se borrarán TODOS los turnos y se liberarán todos los horarios. ¿Continuar?"))return;
 const refs=[...(await getDocs(collection(db,"appointments"))).docs,...(await getDocs(collection(db,"slots"))).docs].map(d=>d.ref);
 for(let i=0;i<refs.length;i+=400){const w=writeBatch(db);refs.slice(i,i+400).forEach(r=>w.delete(r));await w.commit()}load()};
async function settings(){const s=await getDoc(doc(db,"settings","main")),d=s.exists()?s.data():{};
 $("#tSv").value=JSON.stringify(d.services||C.services,null,1);$("#tSc").value=JSON.stringify(d.schedule||C.schedule);$("#tCl").value=JSON.stringify(d.closed||[]);$("#tPr").value=d.promo??C.promo}
$("#save").onclick=async()=>{try{await setDoc(doc(db,"settings","main"),{services:JSON.parse($("#tSv").value),schedule:JSON.parse($("#tSc").value),closed:JSON.parse($("#tCl").value),promo:$("#tPr").value});alert("Guardado")}catch(e){alert("Revisá el formato: "+e.message)}};
</script>
</main></body></html>
